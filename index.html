<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Desglosa · Separador de nombres</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
    <style>
      /* Compatibilidad, no estética: stlite encierra la regla global de Streamlit
         "button { line-height: inherit }" dentro de una clase, y así gana a la altura de línea propia del botón
         (1.6). Con un archivo cargado, la caja de subida quedaba 5 px más baja que en Streamlit Cloud.
         Esta regla devuelve el valor que tiene el botón en Streamlit Cloud. */
      [data-testid="stFileUploaderDropzone"] [data-testid="stBaseButton-borderlessIcon"] { line-height: 1.6; }

      /* Aviso de carga en español (sustituye a los avisos técnicos de stlite en inglés, con el mismo aspecto). */
      #cargando {
        position: fixed; right: 16px; bottom: 16px; z-index: 10000;
        display: flex; align-items: center; gap: 10px;
        padding: 14px 18px; border-radius: 8px;
        background: #fff; color: #6b7280; box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #cargando .giro {
        width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid #d1d5db; border-top-color: #6b7280;
        animation: giro .8s linear infinite;
      }
      @keyframes giro { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="cargando" role="status"><span class="giro"></span>Preparando la aplicación…</div>
    <div id="root"></div>
    <script type="module">
      // Versión stlite: la misma aplicación (app.py, styles.py, parser.py, excel_engine.py) se ejecuta
      // con Python dentro del navegador (Pyodide). El Excel nunca se envía a ningún servidor.
      // Los archivos de Python se leen tal cual del mismo sitio; no hay copias del código aquí.
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";

      mount(
        {
          entrypoint: "app.py",
          disableProgressToasts: true,
          requirements: ["openpyxl>=3.1"],
          files: {
            "app.py": { url: "app.py" },
            "styles.py": { url: "styles.py" },
            "parser.py": { url: "parser.py" },
            "excel_engine.py": { url: "excel_engine.py" },
            "favicon.png": { url: "favicon.png" },
            ".streamlit/config.toml": { url: ".streamlit/config.toml" },
          },
        },
        document.getElementById("root"),
      );

      // El aviso desaparece en cuanto la app dibuja su primer contenido, o si stlite muestra un error de carga
      // (los errores siguen apareciendo con sus propios avisos).
      const aviso = document.getElementById("cargando");
      const observador = new MutationObserver(() => {
        if (document.querySelector('[data-testid="stMarkdownContainer"], .Toastify__toast--error')) {
          aviso.remove();
          observador.disconnect();
        }
      });
      observador.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
