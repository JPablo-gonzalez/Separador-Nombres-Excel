<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Desglosa · Separador de nombres</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
    <style>
      /* Compatibilidad, no estética: stlite encierra la regla global de Streamlit
         "button { line-height: inherit }" dentro de una clase, y así gana a la altura de línea propia del botón
         (1.6). Con un archivo cargado, la caja de subida quedaba 5 px más baja que en Streamlit Cloud.
         Esta regla devuelve el valor que tiene el botón en Streamlit Cloud. */
      [data-testid="stFileUploaderDropzone"] [data-testid="stBaseButton-borderlessIcon"] { line-height: 1.6; }

      /* Fuentes de la interfaz (licencia OFL), servidas desde este mismo sitio: no se piden a Google ni a terceros.
         .streamlit/config.toml las usa por nombre (font, headingFont, codeFont) y styles.py también. */
      @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900;
                   src: url("static/fonts/inter.woff2") format("woff2"); }
      @font-face { font-family: "Space Grotesk"; font-style: normal; font-display: swap; font-weight: 300 700;
                   src: url("static/fonts/space-grotesk.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-display: swap; font-weight: 100 800;
                   src: url("static/fonts/jetbrains-mono.woff2") format("woff2"); }

      /* Pantalla de carga con la estética AuthKit de la app (colores, logo y tipografía de styles.py) mientras se
         prepara Python. Cubre el esqueleto de stlite y desaparece cuando la app dibuja su portada. */
      #cargando {
        --texto: #d1e4fa; --cuerpo: #c7d3ea; --tenue: #9da7ba; --lienzo: #05060f;
        --vidrio: rgba(186,214,247,.03); --relleno: #c7d3ea1f; --borde: #bad7f71f;
        --brillo: rgba(216,236,248,.2); --halo: rgba(0,0,0,.3);
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: var(--lienzo);
        color: var(--cuerpo);
        font-family: "Inter", system-ui, sans-serif;
        transition: opacity .35s ease;
      }
      #cargando.listo { opacity: 0; pointer-events: none; }
      #cargando .tarjeta {
        width: 100%; max-width: 420px; text-align: center;
        padding: 40px 24px 32px 24px; border-radius: 16px;
        background: var(--vidrio);
        box-shadow: inset 0 0 0 1px var(--borde), inset 0 1px 1px var(--brillo), 0 16px 32px var(--halo);
      }
      #cargando .logo { width: 56px; height: 56px; border-radius: 9999px; box-shadow: inset 0 0 0 1px var(--borde); }
      #cargando .logo .fondo { fill: var(--relleno); }
      #cargando .logo .trazo { fill: var(--texto); }
      #cargando .logo .trazo.tenue { fill-opacity: .6; }
      #cargando h1 {
        margin: 16px 0 0 0; font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 44px; font-weight: 500; line-height: 1.1; letter-spacing: -.02em;
        background: linear-gradient(0deg, #d8ecf8 0%, #98c0ef 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      #cargando .lema { margin: 8px 0 0 0; font-size: 18px; font-weight: 500; color: var(--texto); }
      #cargando .estado {
        display: inline-flex; align-items: center; gap: 12px; margin-top: 24px;
        padding: 8px 16px; border-radius: 6px;
        background: var(--relleno); box-shadow: inset 0 0 0 1px var(--borde);
        font-size: 14px; font-weight: 500; color: var(--texto);
      }
      #cargando .giro {
        width: 16px; height: 16px; border-radius: 9999px; flex: none; box-sizing: border-box;
        border: 2px solid var(--borde); border-top-color: var(--texto);
        animation: giro .8s linear infinite;
      }
      #cargando .nota { margin: 16px 0 0 0; font-size: 13px; color: var(--tenue); }
      @keyframes giro { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #cargando .giro { animation-duration: 2.4s; } }
      @media (max-width: 640px) { #cargando h1 { font-size: 40px; } }
    </style>
  </head>
  <body>
    <div id="cargando" role="status" aria-live="polite">
      <div class="tarjeta">
        <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle class="fondo" cx="32" cy="32" r="32"/>
          <rect class="trazo" x="13" y="15" width="38" height="9" rx="4.5"/>
          <rect class="trazo tenue" x="30.5" y="27" width="3" height="4.5"/>
          <path class="trazo tenue" d="M27 31h10l-5 5.5z"/>
          <rect class="trazo" x="13" y="39" width="7.4" height="10" rx="2.2"/>
          <rect class="trazo" x="23" y="39" width="7.4" height="10" rx="2.2"/>
          <rect class="trazo" x="33" y="39" width="7.4" height="10" rx="2.2"/>
          <rect class="trazo" x="43" y="39" width="7.4" height="10" rx="2.2"/>
        </svg>
        <h1>Desglosa</h1>
        <div class="lema">Separador inteligente de nombres</div>
        <div class="estado"><span class="giro"></span>Preparando la aplicación…</div>
        <p class="nota">La primera vez puede tardar unos segundos.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module">
      // Versión stlite: la misma aplicación (app.py, styles.py, parser.py, excel_engine.py, edades.py) se ejecuta
      // con Python dentro del navegador (Pyodide). El Excel nunca se envía a ningún servidor.
      // Los archivos de Python se leen tal cual del mismo sitio; no hay copias del código aquí.
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";

      mount(
        {
          entrypoint: "app.py",
          disableProgressToasts: true,
          requirements: ["openpyxl>=3.1"],
          files: {
            "app.py": { url: "app.py" },
            "styles.py": { url: "styles.py" },
            "parser.py": { url: "parser.py" },
            "excel_engine.py": { url: "excel_engine.py" },
            "edades.py": { url: "edades.py" },
            "favicon.png": { url: "favicon.png" },
            ".streamlit/config.toml": { url: ".streamlit/config.toml" },
          },
        },
        document.getElementById("root"),
      );

      // La pantalla de carga se desvanece en cuanto la app dibuja su portada, o desaparece al momento si
      // stlite muestra un error de carga (los errores siguen apareciendo con sus propios avisos).
      const aviso = document.getElementById("cargando");
      const observador = new MutationObserver(() => {
        if (document.querySelector(".Toastify__toast--error")) {
          aviso.remove();
          observador.disconnect();
        } else if (document.querySelector('.hero, [data-testid="stFileUploader"]')) {
          observador.disconnect();
          setTimeout(() => {
            aviso.classList.add("listo");
            setTimeout(() => aviso.remove(), 400);
          }, 300);
        }
      });
      observador.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
